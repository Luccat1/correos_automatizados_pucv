<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --primary: #24588d;
        --secondary: #1d71b8;
        --accent: #008cba;
        --white: #ffffff;
        --text: #333333;
        --border: #e0e0e0;
        --bg: #f8f8f8;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        color: var(--text);
        background-color: var(--bg);
      }
      .container {
        padding: 20px;
      }
      .header {
        background-color: var(--primary);
        color: var(--white);
        padding: 15px 20px;
        margin-bottom: 20px;
      }
      .header h2 {
        margin: 0;
        font-size: 18px;
      }
      .summary {
        font-size: 13px;
        margin-bottom: 20px;
        color: #666;
        border-bottom: 1px solid var(--border);
        padding-bottom: 10px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        font-size: 14px;
      }
      .form-group input[type="text"],
      .form-group textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 14px;
      }
      .form-group textarea {
        height: 80px;
        resize: vertical;
      }
      .footer {
        margin-top: 25px;
        text-align: right;
      }
      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        margin-left: 10px;
      }
      .btn-primary {
        background-color: var(--primary);
        color: var(--white);
      }
      .btn-primary:hover {
        background-color: var(--secondary);
      }
      .btn-secondary {
        background-color: #ccc;
        color: var(--text);
      }
      .btn-secondary:hover {
        background-color: #bbb;
      }
      .loader {
        display: none;
        margin-top: 10px;
        font-style: italic;
        color: var(--primary);
      }
      #batch-warning {
        animation: fadeIn 0.3s ease-in;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h2><?= asDraft ? '📝 Preparar Borradores' : '📤 Enviar Correos' ?></h2>
    </div>

    <div class="container">
      <div class="summary">
        <strong>Plantilla:</strong> <?= templateName ?><br />
        <strong>Fuente:</strong> <?= dataSheetName ?> (<?= rowCount ?> filas totales)<br />
        <strong>Alias remitente:</strong> <span id="sender-alias"><?= senderAlias || 'cuenta principal' ?></span><br />
        <strong>Filas a procesar:</strong> <span id="processable-count"><em>calculando...</em></span><br />
        <strong>Cuota disponible:</strong> <span id="quota-count"><em>consultando...</em></span> correos restantes
      </div>

      <div id="batch-warning" style="display:none; background-color: #ffebee; border: 2px solid #e53935; border-radius: 4px; padding: 12px 15px; margin-bottom: 20px;">
        <strong style="color: #c62828;">Advertencia: Lote grande</strong>
        <p style="margin: 8px 0; font-size: 13px; color: #b71c1c;">
          Se procesaran <strong><span id="warning-count">--</span></strong> filas, lo cual supera el limite de <strong><span id="warning-threshold">--</span></strong>.
        </p>
        <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer;">
          <input type="checkbox" id="confirm-large-batch" />
          Confirmo que deseo procesar este lote grande
        </label>
      </div>

      <form id="sendForm">
        <div class="form-group">
          <label for="subject">Asunto:</label>
          <input
            type="text"
            id="subject"
            name="subject"
            value="<?= subject ?>"
            required
          />
        </div>

        <div class="form-group">
          <label for="extraNote">Nota Adicional:</label>
          <textarea
            id="extraNote"
            name="extraNote"
            placeholder="Opcional: mensaje que aparecerá en el recuadro amarillo..."
          >
<?= extraNote ?></textarea
          >
        </div>

        <div class="form-group">
          <label for="cc">CC (Copia):</label>
          <input
            type="text"
            id="cc"
            name="cc"
            value="<?= cc ?>"
            placeholder="ejemplo@pucv.cl, otro@pucv.cl"
          />
        </div>

        <div class="form-group">
          <label for="bcc">BCC (Copia Oculta):</label>
          <input type="text" id="bcc" name="bcc" value="<?= bcc ?>" />
        </div>

        <input type="hidden" name="asDraft" value="<?= asDraft ?>" />

        <div id="loader" class="loader">Procesando... por favor espere.</div>

        <div class="footer">
          <button
            type="button"
            class="btn btn-secondary"
            onclick="google.script.host.close()"
          >
            Cancelar
          </button>
          <button type="submit" class="btn btn-primary" id="submitBtn">
            <?= asDraft ? 'Crear Borradores' : 'Iniciar Envío' ?>
          </button>
        </div>
      </form>
    </div>

    <script>
      var preflightData = null;
      var batchWarningActive = false;

      // Fetch pre-flight data on dialog load (ROBUST-04, UX-02)
      google.script.run
        .withSuccessHandler(function(data) {
          if (!data) return;
          preflightData = data;

          // Update quota display
          document.getElementById('quota-count').textContent = data.quota;

          // Update processable row count
          document.getElementById('processable-count').textContent = data.processableRows + ' de ' + data.totalRows;

          // Update sender alias if server has more info
          if (data.senderAlias) {
            document.getElementById('sender-alias').textContent = data.senderAlias;
          }

          // Show batch warning if processable rows exceed threshold (ROBUST-05)
          if (data.processableRows > data.batchThreshold) {
            batchWarningActive = true;
            document.getElementById('warning-count').textContent = data.processableRows;
            document.getElementById('warning-threshold').textContent = data.batchThreshold;
            document.getElementById('batch-warning').style.display = 'block';
            document.getElementById('submitBtn').disabled = true;
          }
        })
        .withFailureHandler(function(err) {
          document.getElementById('quota-count').textContent = 'error';
          document.getElementById('processable-count').textContent = 'error';
          console.error('getPreflightData failed:', err);
        })
        .getPreflightData();

      // Large-batch checkbox enables/disables submit (ROBUST-05)
      document.getElementById('confirm-large-batch').addEventListener('change', function() {
        if (batchWarningActive) {
          document.getElementById('submitBtn').disabled = !this.checked;
        }
      });

      // Form submission
      document.getElementById('sendForm').addEventListener('submit', function(e) {
        e.preventDefault();

        var submitBtn = document.getElementById('submitBtn');
        var loader = document.getElementById('loader');

        submitBtn.disabled = true;
        loader.style.display = 'block';

        var formData = {
          subject: document.getElementById('subject').value,
          extraNote: document.getElementById('extraNote').value,
          cc: document.getElementById('cc').value,
          bcc: document.getElementById('bcc').value,
          asDraft: document.querySelector('input[name="asDraft"]').value === 'true'
        };

        google.script.run
          .withSuccessHandler(function() {
            google.script.host.close();
          })
          .withFailureHandler(function(err) {
            alert('Error: ' + err);
            submitBtn.disabled = false;
            loader.style.display = 'none';
          })
          .executeBatchFromDialog(formData);
      });
    </script>
  </body>
</html>
