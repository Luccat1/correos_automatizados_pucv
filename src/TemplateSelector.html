<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --navy: #001f3f;
        --primary: #24588d;
        --secondary: #1d71b8;
        --accent: #008cba;
        --emerald: #10b981;
        --amber: #f59e0b;
        --white: #ffffff;
        --slate-50: #f8fafc;
        --slate-100: #f1f5f9;
        --slate-200: #e2e8f0;
        --slate-300: #cbd5e1;
        --slate-500: #64748b;
        --slate-600: #475569;
        --slate-800: #1e293b;
        --slate-900: #0f172a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--slate-800);
        background-color: var(--slate-50);
        font-size: 13.5px;
        line-height: 1.5;
        overflow: hidden;
      }

      /* Corporate Header */
      .header {
        background: linear-gradient(135deg, var(--navy) 0%, var(--primary) 50%, var(--secondary) 100%);
        color: var(--white);
        padding: 18px 24px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 4px 14px rgba(0, 31, 63, 0.15);
      }
      .header::after {
        content: '';
        position: absolute;
        top: -60%;
        left: -40%;
        width: 180%;
        height: 220%;
        background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 60%);
        pointer-events: none;
      }
      .header-title-wrap h2 {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.2px;
        color: var(--white);
        margin: 0 0 2px 0;
      }
      .header-title-wrap p {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.8);
        text-transform: uppercase;
        letter-spacing: 0.8px;
        font-weight: 600;
        margin: 0;
      }
      .header-badge {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(4px);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.25);
      }

      .container {
        padding: 18px 24px;
        height: 380px;
        overflow-y: auto;
      }
      .container::-webkit-scrollbar {
        width: 6px;
      }
      .container::-webkit-scrollbar-thumb {
        background: var(--slate-300);
        border-radius: 999px;
      }

      .instruction-box {
        background: var(--white);
        border: 1px solid var(--slate-200);
        border-left: 4px solid var(--secondary);
        border-radius: 8px;
        padding: 10px 14px;
        margin-bottom: 16px;
        font-size: 12.5px;
        color: var(--slate-600);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* Template Bento Cards */
      .template-card {
        background: var(--white);
        border: 1.5px solid var(--slate-200);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
      }
      .template-card:hover {
        border-color: var(--slate-300);
        transform: translateY(-1.5px);
        box-shadow: 0 6px 14px rgba(36, 88, 141, 0.08);
      }
      .template-card.selected {
        border-color: var(--secondary);
        background-color: #f0f7ff;
        box-shadow: 0 0 0 2px var(--secondary), 0 4px 12px rgba(29, 113, 184, 0.15);
      }
      .template-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .template-card h3 {
        font-size: 14.5px;
        font-weight: 700;
        color: var(--slate-900);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .template-card.selected h3 {
        color: var(--primary);
      }
      .template-id {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--slate-600);
        background: var(--slate-100);
        padding: 2px 7px;
        border-radius: 6px;
        border: 1px solid var(--slate-200);
      }
      .template-card .desc {
        font-size: 12.5px;
        color: var(--slate-600);
        line-height: 1.45;
        margin-bottom: 10px;
      }

      /* Tags */
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tag {
        font-size: 10.5px;
        font-weight: 600;
        padding: 2.5px 8px;
        border-radius: 999px;
        background: var(--slate-100);
        color: var(--slate-600);
        border: 1px solid var(--slate-200);
      }
      .tag.required {
        background: #fef3c7;
        color: #92400e;
        border-color: #fde68a;
      }
      .tag.config {
        background: #e0f2fe;
        color: #0369a1;
        border-color: #bae6fd;
      }

      /* Footer */
      .footer {
        padding: 14px 24px;
        background: var(--white);
        border-top: 1px solid var(--slate-200);
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
      }
      .btn {
        padding: 10px 22px;
        border-radius: 8px;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        border: none;
      }
      .btn-secondary {
        background: var(--slate-100);
        color: var(--slate-600);
        border: 1px solid var(--slate-200);
      }
      .btn-secondary:hover {
        background: var(--slate-200);
        color: var(--slate-800);
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--navy) 0%, var(--primary) 50%, var(--secondary) 100%);
        color: var(--white);
        box-shadow: 0 4px 12px rgba(36, 88, 141, 0.25);
      }
      .btn-primary:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(36, 88, 141, 0.35);
      }
      .btn-primary:disabled {
        background: var(--slate-300);
        color: var(--slate-500);
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }

      /* Loader Overlay */
      .loader-overlay {
        display: none;
        padding: 60px 20px;
        text-align: center;
      }
      .spinner {
        display: inline-block;
        width: 32px;
        height: 32px;
        border: 3px solid rgba(36, 88, 141, 0.2);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 12px;
      }
      .loader-text {
        font-size: 14px;
        font-weight: 600;
        color: var(--primary);
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Corporate Header -->
    <div class="header">
      <div class="header-title-wrap">
        <p>Configuración de Campaña</p>
        <h2>⚙️ Selector de Plantilla</h2>
      </div>
      <span class="header-badge"><?= templates.length ?> disponibles</span>
    </div>

    <!-- Loader -->
    <div id="loader" class="loader-overlay">
      <div class="spinner"></div>
      <div class="loader-text">Generando hojas de cálculo y estructura...</div>
    </div>

    <!-- Main Content -->
    <div id="mainContent">
      <div class="container">
        <div class="instruction-box">
          <span>💡</span>
          <span>Selecciona la plantilla deseada. Se configurarán automáticamente las hojas <strong>"Config"</strong> y <strong>"Datos"</strong> correspondientes.</span>
        </div>

        <div id="templateList">
          <? templates.forEach(function(t) { ?>
            <div class="template-card" onclick="selectTemplate('<?= t.id ?>', this)">
              <div class="template-header">
                <h3><?= t.name ?></h3>
                <span class="template-id"><?= t.id ?></span>
              </div>
              <div class="desc"><?= t.description || 'Sin descripción disponible.' ?></div>
              <div class="tags">
                <? t.requiredHeaders.forEach(function(h) { ?>
                  <span class="tag required">🔑 <?= h ?></span>
                <? }); ?>
                <? if (t.configKeys) { t.configKeys.forEach(function(k) { ?>
                  <span class="tag config">⚙️ <?= k ?></span>
                <? }); } ?>
              </div>
            </div>
          <? }); ?>
        </div>
      </div>

      <div class="footer">
        <button class="btn btn-secondary" onclick="google.script.host.close()">Cancelar</button>
        <button id="setupBtn" class="btn btn-primary" disabled onclick="runSetup()">Configurar Plantilla</button>
      </div>
    </div>

    <script>
      let selectedId = null;

      function selectTemplate(id, element) {
        selectedId = id;
        
        // Remove selection from others
        const cards = document.querySelectorAll('.template-card');
        cards.forEach(c => c.classList.remove('selected'));
        
        // Add to this one
        element.classList.add('selected');
        
        // Enable button
        document.getElementById('setupBtn').disabled = false;
      }

      function runSetup() {
        if (!selectedId) return;
        
        const content = document.getElementById('mainContent');
        const loader = document.getElementById('loader');
        
        content.style.display = 'none';
        loader.style.display = 'block';

        google.script.run
          .withSuccessHandler(function() {
            google.script.host.close();
          })
          .withFailureHandler(function(err) {
            alert('Error al generar plantilla: ' + err);
            content.style.display = 'block';
            loader.style.display = 'none';
          })
          .setupTemplateFromDialog(selectedId);
      }
    </script>
  </body>
</html>
